name: Update bypass domains

on:
  workflow_dispatch:
  push:
    paths:
      - custom-domains.txt
      - .github/workflows/update-domains.yml
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and merge domains
        shell: bash
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/kyoresuas/ru-direct/release/ru-standard.domains.txt"

          curl -fLsS --retry 3 "$URL" -o ru-domains.txt

          if [ ! -s ru-domains.txt ]; then
            echo "Russian domain list is empty"
            exit 1
          fi

          cat ru-domains.txt custom-domains.txt |
            sed 's/\r$//' |
            sed 's/#.*//' |
            sed 's/^[[:space:]]*//;s/[[:space:]]*$//' |
            grep -v '^$' |
            sort -u > bypass-domains.txt

          test -s bypass-domains.txt
          echo "Total domains:"
          wc -l bypass-domains.txt

      - name: Commit updated list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bypass-domains.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update bypass domains"
            git push
          fi
